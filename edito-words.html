<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Édito B1 · Слова</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="shell">
  <section class="pagehead">
    <div>
      <div class="kicker">Édito B1 · Словник</div>
      <h1>Слова <em>mots</em></h1>
      <p class="lede">FR + транскрипція спереду; українська, англійська та німецька ззаду. Натисни картку, щоб перевернути. ← → гортати, ↑ озвучити, ↓ перевернути.</p>
    </div>
    <div class="meta">
      <span>позиція</span><b id="pos">—</b>
      <span style="margin-top:8px;display:block">вивчено</span><b id="knownN" style="color:var(--sage)">—</b>
    </div>
  </section>

  <div class="units" id="units"></div>
  <div class="themes" id="themes"></div>

  <div class="statstrip">
    <span><span class="dot k"></span>знаю <b id="nKnown">0</b></span>
    <span><span class="dot u"></span>складні <b id="nUnk">0</b></span>
    <span><span class="dot t"></span>усього <b id="nTot">0</b></span>
    <span>🔥 <b id="streak">0</b></span>
    <span style="flex:1"></span>
    <button class="btn ghost" id="reviewBtn" title="Повторити те, що пора">↻ Повторити (<b id="dueN">0</b>)</button>
    <button class="btn ghost" id="shuffleBtn">⇌ Перемішати</button>
  </div>

  <div class="bc-wrap" id="card">
    <div class="bc-inner" id="inner">
      <div class="bc-face front">
        <div class="lbl">français</div>
        <div class="fr" id="frWord">—</div>
        <div class="ipa" id="ipa"></div>
        <div class="theme" id="frTheme"></div>
        <div class="hint">натисни, щоб перевернути</div>
      </div>
      <div class="bc-face back">
        <div class="lbl">UA · EN · DE</div>
        <div class="tri">
          <div class="row3"><span class="flag ua">UA</span><span class="val" id="ua">—</span></div>
          <div class="row3"><span class="flag en">EN</span><span class="val" id="en">—</span></div>
          <div class="row3"><span class="flag de">DE</span><span class="val" id="de">—</span></div>
        </div>
      </div>
    </div>
  </div>

  <div class="prog"><span id="progBar" style="width:0"></span></div>

  <div class="fc-controls">
    <button class="ctrl sm" id="prevBtn" title="← попередня">←</button>
    <button class="ctrl no" id="noBtn" title="ще не знаю">✗</button>
    <button class="ctrl sp" id="spBtn" title="озвучити">🔊</button>
    <button class="ctrl ok" id="okBtn" title="знаю">✓</button>
    <button class="ctrl sm" id="nextBtn" title="→ наступна">→</button>
  </div>
</div>

<script src="edito.js"></script>
<script src="edito-content.js"></script>
<script src="edito-data-4-12.js"></script>
<script src="edito-data-7-9.js"></script>
<script src="edito-data-10-12.js"></script>
<script src="edito-verbs-4-12.js"></script>
<script src="edito-cahier-expr.js"></script>
<script src="edito-verbs-extra.js"></script>
<script src="edito-expr-extra.js"></script>
<script src="edito-srs.js"></script>
<script src="shared.js"></script>
<script>
renderChrome('edito-words');
const PAGE='edito-words';
let unit='all', theme=null, cards=[], i=0;

const allUnits = [...new Set(EDITO_WORDS.map(w=>w.unit))].sort((a,b)=>a-b);

function load(){
  let base = EDITO_WORDS.filter(w=>unit==='all'||w.unit===unit);
  if(theme) base = base.filter(w=>w.theme===theme);
  cards = base; i = 0;
  renderUnits(); renderThemes(); render();
}
function renderUnits(){
  document.getElementById('units').innerHTML =
    `<button class="chip ${unit==='all'?'active':''}" data-u="all">Усі юніти · ${EDITO_WORDS.length}</button>` +
    allUnits.map(u=>`<button class="chip ${unit===u?'active':''}" data-u="${u}">U${u} · ${EDITO_UNITS[u]}</button>`).join('');
  document.querySelectorAll('#units .chip').forEach(b=>b.onclick=()=>{
    unit = b.dataset.u==='all'?'all':+b.dataset.u; theme=null; load();
  });
}
function renderThemes(){
  const pool = EDITO_WORDS.filter(w=>unit==='all'||w.unit===unit);
  const themes = [...new Set(pool.map(w=>w.theme))];
  document.getElementById('themes').innerHTML =
    `<button class="chip ${theme===null?'active':''}" data-th="">Усі теми · ${pool.length}</button>` +
    themes.map(t=>`<button class="chip ${theme===t?'active':''}" data-th="${t}">${t} · ${pool.filter(w=>w.theme===t).length}</button>`).join('');
  document.querySelectorAll('#themes .chip').forEach(b=>b.onclick=()=>{ theme=b.dataset.th||null; load(); });
}
function fit(el,text){
  el.textContent=text;
  el.classList.remove('sm','xs');
  if(text.length>26) el.classList.add('xs'); else if(text.length>16) el.classList.add('sm');
}
function render(){
  const n=cards.length, p=Progress.get(PAGE);
  document.getElementById('nTot').textContent=n;
  document.getElementById('nKnown').textContent=(p.known||[]).filter(x=>cards.some(c=>c.fr===x)).length;
  document.getElementById('nUnk').textContent=(p.unknown||[]).filter(x=>cards.some(c=>c.fr===x)).length;
  document.getElementById('knownN').textContent=(p.known||[]).length;
  if(!n){document.getElementById('frWord').textContent='—';document.getElementById('pos').textContent='0/0';return;}
  i=((i%n)+n)%n; const c=cards[i];
  fit(document.getElementById('frWord'),c.fr);
  document.getElementById('ipa').textContent=c.ipa?'['+c.ipa+']':'';
  document.getElementById('frTheme').textContent='U'+c.unit+' · '+c.theme;
  document.getElementById('ua').textContent=c.ua;
  document.getElementById('en').textContent=c.en;
  document.getElementById('de').textContent=c.de;
  [['ua',c.ua],['en',c.en],['de',c.de]].forEach(([id,t])=>{
    const el=document.getElementById(id); el.classList.toggle('sm',t.length>22);
  });
  document.getElementById('pos').textContent=(i+1)+'/'+n;
  document.getElementById('progBar').style.width=((i+1)/n*100)+'%';
  document.getElementById('inner').classList.remove('flip');
}
function go(d){if(!cards.length)return;i=(i+d+cards.length)%cards.length;render();}
function mark(ok){if(!cards.length)return;const c=cards[i];
  ok?Progress.addKnown(PAGE,c.fr):Progress.addUnknown(PAGE,c.fr);
  SRS.review(PAGE,c.fr,ok?'good':'hard');
  document.getElementById('streak').textContent=Streak.current();
  document.getElementById('dueN').textContent=SRS.queue(PAGE,EDITO_WORDS.map(w=>w.fr),20).length;
  toast(ok?'✓ вивчено':'↺ повторимо');setTimeout(()=>go(1),220);}
function loadReview(){
  unit='all';theme=null;
  const map=new Map(EDITO_WORDS.map(w=>[w.fr,w]));
  cards=SRS.queue(PAGE,EDITO_WORDS.map(w=>w.fr),20).map(k=>map.get(k)).filter(Boolean);
  i=0;renderUnits();renderThemes();render();
  toast(cards.length?('на повторення: '+cards.length):'усе повторено — почни нові');
}

document.getElementById('card').onclick=()=>document.getElementById('inner').classList.toggle('flip');
document.getElementById('prevBtn').onclick=e=>{e.stopPropagation();go(-1)};
document.getElementById('nextBtn').onclick=e=>{e.stopPropagation();go(1)};
document.getElementById('okBtn').onclick=e=>{e.stopPropagation();mark(true)};
document.getElementById('noBtn').onclick=e=>{e.stopPropagation();mark(false)};
document.getElementById('spBtn').onclick=e=>{e.stopPropagation();if(cards[i])speakFR(cards[i].fr.replace(/\s*=.*$/,'').replace(/\([^)]*\)/g,''))};
document.getElementById('shuffleBtn').onclick=()=>{cards=shuffle(cards);i=0;render();toast('перемішано')};
document.getElementById('reviewBtn').onclick=loadReview;
document.getElementById('streak').textContent=Streak.current();
document.getElementById('dueN').textContent=SRS.queue(PAGE,EDITO_WORDS.map(w=>w.fr),20).length;
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight')go(1);else if(e.key==='ArrowLeft')go(-1);
  else if(e.key==='ArrowDown'||e.key===' '){e.preventDefault();document.getElementById('inner').classList.toggle('flip')}
  else if(e.key==='ArrowUp'){if(cards[i])speakFR(cards[i].fr)}
});
load();
</script>
</body>
</html>
